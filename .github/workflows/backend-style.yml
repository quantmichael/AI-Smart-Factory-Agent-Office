name: Backend Python style

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check Python lint
        run: ruff check --output-format=github backend scripts
      - name: Check Python formatting
        run: ruff format --check backend scripts
